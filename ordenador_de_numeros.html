<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordenador de Números</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .info {
            background: #f0f4ff;
            color: #667eea;
            padding: 10px 12px;
            border-radius: 5px;
            font-size: 12px;
            margin-top: 8px;
            border-left: 3px solid #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-ordenar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-ordenar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-limpiar {
            background: #f0f0f0;
            color: #333;
        }

        .btn-limpiar:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
            animation: slideIn 0.3s ease-in;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-section {
            margin-bottom: 20px;
        }

        .result-title {
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-box {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            padding: 15px;
            min-height: 50px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .number-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px 15px;
            border-radius: 5px;
            border-left: 3px solid #c62828;
            display: none;
            margin-bottom: 20px;
        }

        .error.show {
            display: block;
            animation: slideIn 0.3s ease-in;
        }

        .original-title {
            color: #764ba2;
        }

        .ordenado-title {
            color: #667eea;
        }

        .stats {
            background: #f0f4ff;
            padding: 12px 15px;
            border-radius: 5px;
            margin-top: 15px;
            font-size: 13px;
            color: #333;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            color: #667eea;
            font-weight: 600;
        }

        .process-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .process-title {
            color: #333;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .step-display {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 15px;
            min-height: 80px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .step-number-badge {
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            color: white;
            background: #999;
            transition: all 0.3s ease;
            min-width: 50px;
            text-align: center;
        }

        .step-number-badge.comparing {
            background: linear-gradient(135deg, #ff9800 0%, #ff6f00 100%);
            transform: scale(1.1);
            box-shadow: 0 3px 10px rgba(255, 152, 0, 0.4);
        }

        .step-number-badge.sorted {
            background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
            transform: scale(1);
        }

        .step-number-badge.swapping {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            transform: scale(1.15);
            box-shadow: 0 3px 10px rgba(244, 67, 54, 0.4);
        }

        .process-info {
            background: #e3f2fd;
            border-left: 3px solid #667eea;
            padding: 12px 15px;
            border-radius: 5px;
            font-size: 13px;
            color: #1565c0;
            margin-bottom: 15px;
        }

        .step-counter {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-play {
            background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-play:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-play:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-pause {
            background: linear-gradient(135deg, #ff9800 0%, #ff6f00 100%);
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-pause:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }

        .btn-pause:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-control label {
            margin: 0;
            font-size: 13px;
            color: #666;
        }

        .speed-control input[type="range"] {
            width: 100px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔢 Ordenador de Números</h1>
        <p class="subtitle">Ingresa números y ordénalos de menor a mayor</p>

        <div class="error" id="error"></div>

        <div class="form-group">
            <label for="numeros">Ingresa los números (separados por espacio o coma):</label>
            <input 
                type="text" 
                id="numeros" 
                placeholder="ej: 5 3 8 1 9 o 5, 3, 8, 1, 9"
                autocomplete="off"
            >
            <div class="info">💡 Puedes separar los números con espacios, comas o ambos</div>
        </div>

        <div class="button-group">
            <button class="btn-ordenar" onclick="ordenarNumeros()">Ordenar</button>
            <button class="btn-limpiar" onclick="limpiar()">Limpiar</button>
        </div>

        <div class="results" id="results">
            <div class="result-section">
                <div class="result-title original-title">📋 Números Originales:</div>
                <div class="result-box" id="numerosOriginales"></div>
            </div>

            <div class="result-section">
                <div class="result-title ordenado-title">✅ Números Ordenados (Menor a Mayor):</div>
                <div class="result-box" id="numerosOrdenados"></div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Total de números:</span>
                    <span class="stat-value" id="cantidad">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Rango:</span>
                    <span class="stat-value" id="rango">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Mínimo:</span>
                    <span class="stat-value" id="minimo">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Máximo:</span>
                    <span class="stat-value" id="maximo">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function ordenarNumeros() {
            const input = document.getElementById('numeros').value;
            const errorDiv = document.getElementById('error');
            
            // Limpiar error previo
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';

            // Validar que haya entrada
            if (input.trim() === '') {
                mostrarError('Por favor ingresa al menos un número');
                return;
            }

            try {
                // Separar números por espacios o comas
                const numerosOriginales = input
                    .split(/[\s,]+/)
                    .filter(n => n.trim() !== '')
                    .map(n => {
                        const num = parseFloat(n);
                        if (isNaN(num)) {
                            throw new Error(`"${n}" no es un número válido`);
                        }
                        return num;
                    });

                if (numerosOriginales.length === 0) {
                    mostrarError('No se encontraron números válidos');
                    return;
                }

                // Crear copia para dejar los originales intactos
                const numerosOrdenados = [...numerosOriginales].sort((a, b) => a - b);

                // Mostrar resultados
                mostrarResultados(numerosOriginales, numerosOrdenados);

            } catch (error) {
                mostrarError(error.message);
            }
        }

        function mostrarResultados(original, ordenado) {
            // Mostrar números originales
            const originalDiv = document.getElementById('numerosOriginales');
            originalDiv.innerHTML = original
                .map(n => `<span class="number-badge">${n}</span>`)
                .join('');

            // Mostrar números ordenados
            const ordenadoDiv = document.getElementById('numerosOrdenados');
            ordenadoDiv.innerHTML = ordenado
                .map(n => `<span class="number-badge">${n}</span>`)
                .join('');

            // Calcular estadísticas
            const minimo = ordenado[0];
            const maximo = ordenado[ordenado.length - 1];
            const rango = maximo - minimo;

            document.getElementById('cantidad').textContent = original.length;
            document.getElementById('minimo').textContent = minimo;
            document.getElementById('maximo').textContent = maximo;
            document.getElementById('rango').textContent = rango;

            // Mostrar resultados
            document.getElementById('results').classList.add('show');
        }

        function mostrarError(mensaje) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = '❌ ' + mensaje;
            errorDiv.classList.add('show');
            document.getElementById('results').classList.remove('show');
        }

        function limpiar() {
            document.getElementById('numeros').value = '';
            document.getElementById('results').classList.remove('show');
            document.getElementById('error').classList.remove('show');
            document.getElementById('numeros').focus();
        }

        // Permitir ordenar con Enter
        document.getElementById('numeros').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                ordenarNumeros();
            }
        });

        // Focus al cargar
        window.addEventListener('load', function() {
            document.getElementById('numeros').focus();
        });
    </script>
</body>
</html>
